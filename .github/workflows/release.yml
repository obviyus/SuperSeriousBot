name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Daily: rebuild only when yt-dlp has a new release, so extractor fixes for
  # Instagram, X and others reach production without anyone noticing a break.
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/obviyus/superseriousbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run check

  yt-dlp:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve the current yt-dlp release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          version="$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name)"
          [ -n "$version" ] || { echo "Could not resolve the yt-dlp release" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          build=true
          if [ "$EVENT" = schedule ]; then
            deployed="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{ json (index .Image "linux/amd64").Config.Labels }}' \
              | jq -r '."org.obviyus.superseriousbot.yt-dlp" // ""' || true)"
            [ "$deployed" = "$version" ] && build=false
            echo "deployed yt-dlp: ${deployed:-unknown}, latest: $version"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name != 'pull_request' && needs.yt-dlp.outputs.build == 'true'
    needs: [test, yt-dlp]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            YTDLP_VERSION=${{ needs.yt-dlp.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.ref_name }}-superseriousbot
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-superseriousbot
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          echo "${{ steps.build.outputs.digest }}" | sed 's/^sha256://' | xargs -I{} touch "${{ runner.temp }}/digests/{}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect $IMAGE:latest
