[project]
name = "superseriousbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ai[openai]~=0.5.0",
  "async-lru~=2.3.0",
  "coloredlogs>=15.0.1",
  "dateparser~=1.4.2",
  "googletrans>=4.0.2",
  "howlongtobeatpy~=1.0.23",
  "httpx2>=2.12.0",
  "ijson~=3.5.1",
  "libsql>=0.1.11",
  "pillow>=12.3.0",
  "python-dotenv~=1.2.3",
  "python-telegram-bot[job-queue,rate-limiter,webhooks]~=22.8",
  "telegramify-markdown~=1.2.0",
  "yt-dlp~=2026.8.19",
]


[tool.ruff.lint]
ignore = [
  "E501", # line length (handled by formatter/line-length)
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ty.environment]
python-version = "3.13"
root = ["src"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
